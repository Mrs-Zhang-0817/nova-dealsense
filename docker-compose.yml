services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nova_dealsense
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d nova_dealsense"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/nova_dealsense
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
volumes:
  pgdata:
